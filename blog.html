<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 - FirefairyZz</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#ef4444', accent: '#f97316' },
                    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; overflow-x: hidden; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .bg-gradient-layer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -2; background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 50%, #dce1eb 100%); }
        .bg-image-layer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; opacity: 0; transition: opacity 1.2s ease; background-size: cover; background-position: center; background-repeat: no-repeat; }
        .bg-image-layer.loaded { opacity: 0.35; }
        .bg-image-layer::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, rgba(245,247,250,0.85) 0%, rgba(228,232,240,0.70) 100%); }
        .nav-blur { background: rgba(255,255,255,0.70); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgba(0,0,0,0.06); }
        .nav-link { position: relative; color: #555; font-weight: 450; transition: color 0.25s ease; text-decoration: none; }
        .nav-link::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px; background: #ef4444; transition: width 0.3s ease; border-radius: 1px; }
        .nav-link:hover { color: #ef4444; }
        .nav-link:hover::after { width: 100%; }
        .nav-link.active { color: #ef4444; }
        .nav-link.active::after { width: 100%; }
        .btn-primary { background: #ef4444; color: #fff; padding: 8px 22px; border-radius: 999px; font-weight: 500; font-size: 0.95rem; transition: all 0.3s ease; text-decoration: none; display: inline-block; }
        .btn-primary:hover { background: #dc2626; box-shadow: 0 4px 16px rgba(239,68,68,0.30); transform: translateY(-1px); }
        .avatar-ring { position: relative; display: inline-block; }
        .avatar-ring::before { content: ''; position: absolute; inset: -3px; border-radius: 50%; background: linear-gradient(135deg, #ef4444, #f97316, #f59e0b); opacity: 0.6; }
        .mobile-menu { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 16px; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 8px 32px rgba(0,0,0,0.08); }
        footer { background: rgba(255,255,255,0.60); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid rgba(0,0,0,0.04); }

        /* 博客卡片（同时作为 <a> 链接） */
        .blog-card {
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.02);
            transition: all 0.35s ease;
            overflow: hidden;          /* 保证图片圆角裁剪 */
            text-decoration: none;     /* 去除下划线 */
            color: inherit;            /* 文字颜色继承 */
        }
        .blog-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
            border-color: rgba(239,68,68,0.12);
        }
        .blog-card .card-img {
            width: 100%;
            height: 160px;             /* 列表页封面图高度 */
            object-fit: cover;
            background: #e8ecf2;
        }
        .blog-card .card-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .blog-tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 500;
            background: rgba(239,68,68,0.07);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.15);
        }
        .read-more {
            color: #ef4444;
            font-weight: 500;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: gap 0.2s ease;
        }
        .blog-card:hover .read-more {
            gap: 8px;
        }
        @media (max-width: 640px) {
            .blog-card { border-radius: 16px; }
            .blog-card .card-img { height: 140px; }
            .blog-card .card-body { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient-layer"></div>
    <div class="bg-image-layer" id="bgImage"></div>

    <nav class="nav-blur fixed top-0 left-0 right-0 z-50">
        <div class="flex items-center justify-between h-16 px-5 sm:px-8 max-w-6xl mx-auto">
            <a href="index.html" class="flex items-center gap-3 no-underline">
                <div class="avatar-ring">
                    <img src="https://raw.githubusercontent.com/firefairyZz/firefairyZz.github.io/web/images/face.jpg" alt="头像" class="relative w-9 h-9 rounded-full object-cover border-2 border-white">
                </div>
                <span class="text-lg font-semibold text-gray-800 tracking-tight">FirefairyZz</span>
            </a>
            <div class="hidden md:flex items-center gap-8">
                <a href="index.html" class="nav-link text-sm">首页</a>
                <a href="projects.html" class="nav-link text-sm">项目</a>
                <a href="blog.html" class="nav-link active text-sm">博客</a>
                <a href="about.html" class="nav-link text-sm">关于</a>
            </div>
            <div class="hidden md:block">
                <a href="contact.html" class="btn-primary text-sm">联系我</a>
            </div>
            <button class="md:hidden text-gray-600 text-xl p-1" id="menuBtn">
                <i class="fa fa-bars"></i>
            </button>
        </div>
        <div class="md:hidden hidden mx-4 mb-3 mobile-menu overflow-hidden" id="mobileMenu">
            <div class="flex flex-col">
                <a href="index.html" class="nav-link block px-4 py-3 text-sm border-b border-black/5">首页</a>
                <a href="projects.html" class="nav-link block px-4 py-3 text-sm border-b border-black/5">项目</a>
                <a href="blog.html" class="nav-link active block px-4 py-3 text-sm border-b border-black/5">博客</a>
                <a href="about.html" class="nav-link block px-4 py-3 text-sm border-b border-black/5">关于</a>
                <a href="contact.html" class="block px-4 py-3 text-sm text-primary font-medium">联系我</a>
            </div>
        </div>
    </nav>

    <main class="min-h-screen px-5 sm:px-8 pt-28 pb-28">
        <div class="max-w-3xl mx-auto">
            <div class="mb-10">
                <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 tracking-tight">博客</h1>
                <p class="text-gray-500 mt-2 text-sm">偶尔写写，记录一些学习路上的碎碎念 📝</p>
            </div>

            <div id="blog-list" class="space-y-6">
                <div class="text-center text-gray-400 py-10"><i class="fa fa-spinner fa-pulse"></i> 加载中...</div>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 py-3 text-center text-gray-400 text-xs">
        <p>&copy; 2024 FirefairyZz &mdash; 练习作品</p>
    </footer>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            const icon = menuBtn.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-times');
        });

        (function loadBackground() {
            const bg = document.getElementById('bgImage');
            const img = new Image();
            img.src = 'https://uapis.cn/api/v1/random/image';
            img.onload = () => { bg.style.backgroundImage = 'url(' + img.src + ')'; bg.classList.add('loaded'); };
        })();

        // 扩展解析函数，增加 show_image 和 image
        function parseINI(iniText) {
            const result = { title: '', date: '', summary: '', tags: [], show_image: false, image: '', full_image: false };
            const lines = iniText.split('\n');
            let currentSection = '';
            for (let line of lines) {
                line = line.trim();
                if (line === '' || line.startsWith(';') || line.startsWith('#')) continue;
                const secMatch = line.match(/^\[(.+)\]$/);
                if (secMatch) { currentSection = secMatch[1].trim(); continue; }
                const kvMatch = line.match(/^([^=]+)=(.*)$/);
                if (kvMatch) {
                    const key = kvMatch[1].trim();
                    const value = kvMatch[2].trim();
                    if (currentSection === 'Info') {
                        if (key === 'title') result.title = value;
                        else if (key === 'date') result.date = value;
                        else if (key === 'summary') result.summary = value;
                        else if (key === 'show_image') result.show_image = value.toLowerCase() === 'true';
                        else if (key === 'image') result.image = value;
                        else if (key === 'full_image') result.full_image = (value.toLowerCase() === 'true');
                    } else if (currentSection === 'Tags') {
                        if (/^\d+$/.test(key)) result.tags.push(value);
                    }
                }
            }
            return result;
        }

        async function loadBlogList() {
            const container = document.getElementById('blog-list');
            try {
                const txtRes = await fetch('Blog/Blog.txt');
                if (!txtRes.ok) throw new Error('找不到 Blog/Blog.txt');
                const text = await txtRes.text();
                const articleNames = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

                if (articleNames.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-center py-10">还没有文章</p>';
                    return;
                }

                const articles = await Promise.all(articleNames.map(async (name) => {
                    try {
                        const iniRes = await fetch(`Blog/${name}/Intro.ini`);
                        if (!iniRes.ok) throw new Error(`找不到 ${name} 的 Intro.ini`);
                        const iniText = await iniRes.text();
                        const info = parseINI(iniText);
                        return { name, ...info };
                    } catch (err) {
                        console.warn(`加载文章 ${name} 失败:`, err);
                        return null;
                    }
                }));

                const validArticles = articles.filter(a => a !== null);
                if (validArticles.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-center py-10">暂无可用文章</p>';
                    return;
                }

                container.innerHTML = validArticles.map(article => {
                    const tagsHTML = (article.tags || []).map(tag => `<span class="blog-tag">${tag}</span>`).join('');
                    // 封面图（如果需要）
                    let coverImgHTML = '';
                    if (article.show_image && article.image) {
                        const imgSrc = article.image.startsWith('http') ? article.image : `Blog/${article.name}/${article.image}`;
                        const fitStyle = article.full_image ? 'contain' : 'cover';
                        const bgColor = article.full_image ? '#f0f0f0' : '#e8ecf2';
                        coverImgHTML = `<img src="${imgSrc}" alt="${article.title} 封面" class="card-img" style="object-fit: ${fitStyle}; background: ${bgColor}" onerror="this.style.display='none'">`;
                    }
                    return `
                    <a href="Blog/${article.name}/" class="blog-card">
                        ${coverImgHTML}
                        <div class="card-body">
                            <div class="flex items-center gap-2 mb-2 text-xs text-gray-400">
                                <span>${article.date || '未标注日期'}</span>
                                ${tagsHTML ? '<span>·</span>' + tagsHTML : ''}
                            </div>
                            <h2 class="text-xl font-semibold text-gray-800 mb-2 leading-snug">${article.title}</h2>
                            <p class="text-gray-500 text-sm leading-relaxed flex-1">${article.summary || ''}</p>
                            <div class="mt-4">
                                <span class="read-more">阅读更多 <i class="fa fa-arrow-right" style="font-size:0.7rem"></i></span>
                            </div>
                        </div>
                    </a>
                    `;
                }).join('');

            } catch (error) {
                console.error(error);
                container.innerHTML = `<p class="text-red-400 text-center py-10">加载失败：${error.message}</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadBlogList);
    </script>
</body>
</html>
