<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - FirefairyZz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#ef4444', accent: '#f97316' },
                    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .bg-gradient-layer {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: -2;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 50%, #dce1eb 100%);
        }
        .bg-image-layer {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1; opacity: 0;
            transition: opacity 1.2s ease;
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }
        .bg-image-layer.loaded { opacity: 0.35; }
        .bg-image-layer::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(245,247,250,0.85) 0%, rgba(228,232,240,0.70) 100%);
        }
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04), 0 1px 4px rgba(0, 0, 0, 0.02);
        }
        footer {
            background: rgba(255, 255, 255, 0.60);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body>

    <div class="bg-gradient-layer"></div>
    <div class="bg-image-layer" id="bgImage"></div>

    <main class="min-h-screen flex items-center justify-center px-5 sm:px-8">
        <div class="w-full max-w-lg mx-auto text-center">
            <div class="card p-10 sm:p-14">
                <p class="text-8xl sm:text-9xl font-bold text-gray-200 tracking-tight select-none">404</p>
                <h1 class="text-xl sm:text-2xl font-semibold text-gray-800 mt-2">页面走丢了</h1>
                <p class="text-gray-500 text-sm mt-3 leading-relaxed">
                    你访问的页面不存在，可能已被移除或地址输入有误。
                </p>
                <div class="mt-8 flex gap-3 justify-center">
                    <a href="index.html" class="inline-flex items-center gap-2 bg-gray-800 hover:bg-gray-700 text-white text-sm font-medium px-5 py-2.5 rounded-xl transition-all duration-300">
                        <i class="fa fa-home" style="font-size:0.9rem"></i>
                        返回首页
                    </a>
                    <a href="javascript:history.back()" class="inline-flex items-center gap-2 bg-white/60 hover:bg-white/80 text-gray-700 text-sm font-medium px-5 py-2.5 rounded-xl transition-all duration-300 border border-gray-200/60">
                        <i class="fa fa-arrow-left" style="font-size:0.85rem"></i>
                        后退一步
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 py-3 text-center text-gray-400 text-xs">
        <p>&copy; 2024 FirefairyZz &mdash; 设计与开发</p>
    </footer>

    <script>
        (function loadBackground() {
            const bg = document.getElementById('bgImage');
            const img = new Image();
            img.src = 'https://uapis.cn/api/v1/random/image';
            img.onload = () => { bg.style.backgroundImage = 'url(' + img.src + ')'; bg.classList.add('loaded'); };
        })();
    </script>
</body>
</html>
